<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Forgot Password</h2>
    <p class="text-center text-gray-500 mb-6">Enter your registered email</p>

    <form [formGroup]="forgotForm" (ngSubmit)="sendOtp()" class="space-y-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="Enter your email">

        @if (forgotForm.get('email')?.hasError('required') && forgotForm.get('email')?.touched) {
          <mat-error>Email is required</mat-error>
        }

        @if (forgotForm.get('email')?.hasError('email')) {
          <mat-error>Enter a valid email</mat-error>
        }
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="w-full !py-6"
        [disabled]="loading"
      >
        {{ loading ? 'Sending OTP...' : 'Send OTP' }}
      </button>
    </form>

    <p class="text-center mt-6">
      <a routerLink="/login" class="text-blue-600 hover:underline cursor-pointer">
        Back to Login
      </a>
    </p>
  </div>
</div>
