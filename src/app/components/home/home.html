<!-- ================= 1. DYNAMIC NATIVE BANNER SLIDER (Exact Flipkart Layout) ================= -->
<div class="w-full px-6 mt-6 mb-4 max-w-7xl mx-auto relative group">
  
  <!-- Horizontal Scrolling Row Wrapper Element -->
  <div #sliderContainer 
       class="flex overflow-x-auto gap-4 scroll-smooth scrollbar-none snap-x snap-mandatory pb-4">
    
    @for (item of bannerImages; track $index) {
      <!-- Individual Flat Banner Card (3 Columns Grid Metrics Side-by-Side) -->
      <div class="min-w-[calc(33.333%-11px)] md:min-w-[calc(33.333%-11px)] sm:min-w-[calc(50%-8px)] min-w-full flex-shrink-0 snap-start snap-always rounded-xl overflow-hidden shadow-sm border border-gray-100 h-[220px]">
        
        <!-- Absolute Banner Wrapper Content -->
        <div class="w-full h-full relative cursor-pointer" [routerLink]="['/products', item._id]">
          <img *ngIf="item?.image && item.image.length > 0" 
               [src]="item.image" 
               [alt]="item.name" 
               class="w-full h-full object-cover">
          
          <!-- Image check warning text wrapper if link missing -->
          <div *ngIf="!item?.image || item.image.length === 0" class="w-full h-full bg-gray-100 flex items-center justify-center text-xs text-gray-400">
            No Active Banner Asset Available
          </div>
        </div>

      </div>
    }

  </div>

  <!-- Dynamic Centered Miniature Indicator Navigation Dots (Exact Screenshot Style) -->
  <div class="flex items-center justify-center gap-1.5 mt-2 w-full" *ngIf="bannerImages.length > 3">
    <!-- Math operation matrix math sets indicators -->
    <button *ngFor="let dot of getDotCount(); let i = index" 
            type="button"
            (click)="scrollToSlide(i)"
            [class]="i === activeSlideIndex ? 'w-3 h-1.5 bg-gray-600 rounded-full transition-all duration-200' : 'w-1.5 h-1.5 bg-gray-300 rounded-full transition-all duration-200'"
            [title]="'Go to panel ' + (i + 1)">
    </button>
  </div>

</div>

<!-- ================= 2. AAPKA EXACT EXISTING PRODUCTS LAYOUT CONTAINER ================= -->
<div class="max-w-7xl mx-auto px-6 py-10 min-h-screen bg-white">

  <!-- FEATURED PRODUCTS SECTION -->
  <div class="mb-14" *ngIf="featuredProducts.length > 0">
    <h2 class="text-xl font-normal text-gray-900 mb-6 tracking-wide">
      Featured Products
    </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let prod of featuredProducts" [product]="prod"></app-product-card>
    </div>
  </div>

  <!-- NEW ARRIVALS PRODUCTS SECTION -->
  <div class="mb-10" *ngIf="newProducts.length > 0">
    <h2 class="text-xl font-normal text-gray-900 mb-6 tracking-wide">
      New Arrivals
    </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let prod of newProducts" [product]="prod"></app-product-card>
    </div>
  </div>

</div>
