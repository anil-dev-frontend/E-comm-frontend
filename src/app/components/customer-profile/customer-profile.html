<div class="min-h-screen bg-gray-50 px-4 py-10">

  <div class="mx-auto max-w-2xl">

    <!-- Heading -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">
        My Profile
      </h1>

      <p class="mt-2 text-sm text-gray-500">
        Manage your account information
      </p>
    </div>

    <!-- Profile Card -->
    <div class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-gray-100">

      <!-- Profile Header -->
      <div class="bg-gradient-to-r from-indigo-600 to-blue-600 px-6 py-8">

        <div class="flex items-center gap-5">

          <!-- Avatar -->
          <div
            class="flex h-20 w-20 items-center justify-center rounded-full bg-white text-2xl font-bold text-indigo-600 shadow-lg">
            {{ userName.charAt(0).toUpperCase() }}
          </div>

          <div class="text-white">
            <h2 class="text-2xl font-semibold">
              {{ userName }}
            </h2>

            <p class="mt-1 text-sm text-blue-100">
              Customer Account
            </p>
          </div>

        </div>

      </div>

      <!-- User Information -->
      <div class="p-6">

        <h3 class="mb-5 text-lg font-semibold text-gray-900">
          Account Information
        </h3>

        <div class="space-y-4">

          <!-- Username -->
          <div
            class="flex items-center gap-4 rounded-xl border border-gray-100 bg-gray-50 p-4">

            <div
              class="flex h-11 w-11 items-center justify-center rounded-lg bg-indigo-100 text-indigo-600">
              <span class="text-lg">👤</span>
            </div>

            <div>
              <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                Username
              </p>

              <p class="mt-1 font-medium text-gray-800">
                {{ userName }}
              </p>
            </div>

          </div>

          <!-- Email -->
          <div
            class="flex items-center gap-4 rounded-xl border border-gray-100 bg-gray-50 p-4">

            <div
              class="flex h-11 w-11 items-center justify-center rounded-lg bg-blue-100 text-blue-600">
              <span class="text-lg">✉</span>
            </div>

            <div>
              <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                Email Address
              </p>

              <p class="mt-1 font-medium text-gray-800">
                {{ email }}
              </p>
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
