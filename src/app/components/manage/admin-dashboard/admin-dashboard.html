<div class="min-h-screen bg-gray-50 px-6 py-10">

  <div class="max-w-6xl mx-auto">

    <h1 class="text-2xl font-bold text-gray-800 text-center mb-10">
      Admin Dashboard
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <!-- Manage Category -->
      <div class="bg-white rounded-xl shadow-sm p-8 text-center border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">
          Manage Category
        </h2>

        <button
          type="button"
          routerLink="/admin/categories"
          class="px-5 py-2 rounded-full border border-gray-300 bg-white text-blue-600 text-sm font-medium shadow-sm hover:bg-blue-600 hover:text-white hover:border-blue-600 transition duration-200">

          Manage Category

        </button>
      </div>

      <!-- Manage Products -->
      <div class="bg-white rounded-xl shadow-sm p-8 text-center border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">
          Manage Products
        </h2>

        <button
          type="button"
          routerLink="/admin/products"
          class="px-5 py-2 rounded-full border border-gray-300 bg-white text-blue-600 text-sm font-medium shadow-sm hover:bg-blue-600 hover:text-white hover:border-blue-600 transition duration-200">

          Manage Products

        </button>
      </div>

      <!-- Manage Brands -->
      <div class="bg-white rounded-xl shadow-sm p-8 text-center border border-gray-100">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">
          Manage Brands
        </h2>

        <button
          type="button"
          routerLink="/admin/brands"
          class="px-5 py-2 rounded-full border border-gray-300 bg-white text-blue-600 text-sm font-medium shadow-sm hover:bg-blue-600 hover:text-white hover:border-blue-600 transition duration-200">

          Manage Brands

        </button>
      </div>

    </div>

  </div>

</div>
