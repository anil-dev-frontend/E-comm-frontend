<div class="px-40 mt-10">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Manage Brand</h1>
        <!-- Route URL change kiya brand ke liye -->
        <button routerLink="/admin/brands/add" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow">
            Add New Brand
        </button>
    </div>

    <!-- Global Error Display -->
    <div *ngIf="errorMessage" class="alert alert-warning p-2 my-2 bg-amber-100 text-amber-800 rounded">
        {{ errorMessage }}
    </div>

    <div class="shadow rounded-lg p-4 bg-white">
        <mat-form-field class="w-full">
            <mat-label>Filter Brand</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Nike" #input>
        </mat-form-field>

        <table mat-table [dataSource]="dataSource" matSort class="w-full text-left border-collapse">

            <!-- Brand ID Column -->
            <ng-container matColumnDef="_id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Brand ID </th>
                <td mat-cell *matCellDef="let row"> {{row._id}} </td>
            </ng-container>

            <!-- Brand Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Brand Name </th>
                <td mat-cell *matCellDef="let row"> {{row.name}} </td>
            </ng-container>

            <!-- Combined Actions Column (Edit + Delete) -->
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let row">
                    <!-- Update/Edit Button -->
                    <button mat-icon-button color="primary" (click)="onEdit(row)" title="Edit Brand">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <!-- Delete Button -->
                    <button mat-icon-button color="warn" (click)="onDelete(row._id)" title="Delete Brand">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- No Data Found Row -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell p-4 text-center text-gray-500" colspan="3">
                    No data matching the filter "{{input.value}}" or list is empty.
                </td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of brands"></mat-paginator>
    </div>
</div>
