<div class="px-40 mt-10">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Manage Products</h1>
        <button routerLink="/admin/products/add" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow">
            Add New Product
        </button>
    </div>

    <!-- Global Error Display -->
    <div *ngIf="errorMessage" class="alert alert-warning p-2 my-2 bg-amber-100 text-amber-800 rounded">
        {{ errorMessage }}
    </div>

    <div class="shadow rounded-lg p-4 bg-white">
        <mat-form-field class="w-full">
            <mat-label>Filter Product</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Headphones" #input>
        </mat-form-field>

        <table mat-table [dataSource]="dataSource" matSort class="w-full text-left border-collapse">

            <!-- Product Image Column -->
            <ng-container matColumnDef="image">
                <th mat-header-cell *matHeaderCellDef> Image </th>
                <td mat-cell *matCellDef="let row"> 
                    <img *ngIf="row.image && row.image.length > 0" [src]="row.image[0]" alt="product" class="w-12 h-12 object-cover rounded-md my-1 border">
                    <span *ngIf="!row.image || row.image.length === 0" class="text-gray-400 text-xs">No Img</span>
                </td>
            </ng-container>

            <!-- Product Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Product Name </th>
                <td mat-cell *matCellDef="let row" class="font-medium text-gray-800"> {{row.name}} </td>
            </ng-container>

            <!-- Category Column (Populated Object Binding) -->
            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Category </th>
                <!-- Safe navigation operator (?.) lagaya hai taaki null hone par crash na ho -->
                <td mat-cell *matCellDef="let row"> {{row.categoryId?.name || 'N/A'}} </td>
            </ng-container>

            <!-- Price Column -->
            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
                <td mat-cell *matCellDef="let row"> ₹{{row.price | number}} </td>
            </ng-container>

            <!-- Discount Column -->
            <ng-container matColumnDef="discount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Discount </th>
                <td mat-cell *matCellDef="let row"> 
                    <span class="bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-semibold">
                        {{row.discount}}% OFF
                    </span>
                </td>
            </ng-container>

            <!-- Combined Actions Column (Edit + Delete) -->
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let row">
                    <!-- Update/Edit Button -->
                    <button mat-icon-button color="primary" (click)="onEdit(row)" title="Edit Product">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <!-- Delete Button -->
                    <button mat-icon-button color="warn" (click)="onDelete(row._id)" title="Delete Product">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- No Data Found Row -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell p-4 text-center text-gray-500" colspan="6">
                    No data matching the filter "{{input.value}}" or list is empty.
                </td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of products"></mat-paginator>
    </div>
</div>
